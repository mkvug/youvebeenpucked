name: Deploy

on:
  repository_dispatch:
    types: [airtable-update]
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          PUBLIC_AIRTABLE_KEEP_WEBHOOK_URL: ${{ secrets.PUBLIC_AIRTABLE_KEEP_WEBHOOK_URL }}
          PUBLIC_AIRTABLE_REHIDE_WEBHOOK_URL: ${{ secrets.PUBLIC_AIRTABLE_REHIDE_WEBHOOK_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
